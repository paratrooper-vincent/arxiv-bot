# arxiv-bot 云端备用方案（GitHub Actions）
#
# 当前策略：本地 Windows 任务计划程序为主力（每天 08:00 抓推 / 周一 08:30 周报），
# 云端定时已注释、只保留手动触发，避免两边同时推送造成重复。
#
# 说明：
# 1. 若要改用云端定时：取消下方 schedule 注释，并禁用本地两个任务
#    （任务计划程序 -> arxiv_bot / arxiv_weekly -> 禁用）。
#    cron 用的是 UTC 时间！北京 08:00 = UTC 00:00。
# 2. 所有密钥从仓库 Secrets 注入（Settings -> Secrets and variables -> Actions）：
#    - FEISHU_WEBHOOK  必填（飞书机器人地址）
#    - LLM_API_KEY / LLM_BASE_URL / LLM_MODEL  选填（配了才有 LLM 点评与 AI 周报）
# 3. Actions 每次运行都是全新环境，SQLite 去重状态不保留，推送可能与本地有少量重复。
# 4. 手动触发：Actions 页面选本工作流 -> Run workflow，可选执行 run 或 weekly。

name: arxiv-bot

on:
  # schedule:
  #   - cron: "0 0 * * *"    # 每天 UTC 00:00 = 北京 08:00 抓推
  #   - cron: "30 0 * * 1"   # 每周一 UTC 00:30 = 北京 08:30 周报
  workflow_dispatch:
    inputs:
      task:
        description: "要执行的任务"
        required: false
        default: "run"
        type: choice
        options: [run, weekly]

jobs:
  daily:
    # 每日定时触发，或手动选了 run
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # 云端是全新环境，gitignore 掉的 config.json 不在仓库里，从模板生成一份
      - run: cp config.example.json config.json
      - name: 每日抓取与推送
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m arxiv_bot run
        # 手动选 weekly 时本 job 跳过实际执行
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.task == 'run'

  weekly:
    # 周一定时触发，或手动选了 weekly
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 0 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # 云端是全新环境，gitignore 掉的 config.json 不在仓库里，从模板生成一份
      - run: cp config.example.json config.json
      - name: 每周汇总推送
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m arxiv_bot weekly
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.task == 'weekly'
